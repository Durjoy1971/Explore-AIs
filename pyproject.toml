[project]
name = "bangla-smish-audit"
version = "0.1.0"
description = "Shortcut-Resistant, On-Device Bangla and Code-Mixed Smishing Detection Research Pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "huggingface_hub>=0.24",
    "openpyxl>=3.1",
    "requests>=2.31",
    "nbformat>=5.10",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.2",
    "transformers>=4.44",
    "datasets>=2.20",
    "accelerate>=0.33",
    "peft>=0.12",
    "bitsandbytes>=0.43",
    "onnxruntime>=1.18",
]
